name: ML API - Continuous Integration

on:
  push:
    branches: [main]
    paths:
      - "ml-inference-service/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "ml-inference-service/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ml-inference-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml-inference-service/requirements.txt
            ml-inference-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint code
        run: |
          ruff check app scripts tests

      - name: Run tests
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t ml-inference-api:test .
